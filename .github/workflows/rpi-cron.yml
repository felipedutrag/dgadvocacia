name: Sincronizador Radar RPI Semanal

on:
  schedule:
    # Toda terça-feira às 13:00 UTC (10:00 Horário de Brasília)
    - cron: '0 13 * * 2'
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub

jobs:
  sincronizar-rpi:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Worker da RPI
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: npx tsx scripts/sync-rpi.ts
